<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vessel Track - Live AIS & Maritime Fleet Monitoring</title>
  
  <!-- PWA & Theme Metadata -->
  <meta name="theme-color" content="#0F172A">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Leaflet Map CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Font Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    #map { height: 100%; width: 100%; z-index: 1; }

    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #090d16; }
    ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }

    /* Custom Leaflet Popup Dark Mode Styling */
    .leaflet-popup-content-wrapper, .leaflet-popup-tip {
      background-color: #0f172a !important;
      color: #f1f5f9 !important;
      border: 1px solid #334155;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border-radius: 0.75rem !important;
    }
    .leaflet-popup-content { margin: 12px 14px !important; line-height: 1.4; }
    .leaflet-container a.leaflet-popup-close-button { color: #94a3b8 !important; padding: 8px !important; }
    .leaflet-container a.leaflet-popup-close-button:hover { color: #ffffff !important; }

    /* Rotating Vessel Marker SVG */
    .vessel-icon-wrapper {
      transition: transform 0.4s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Pulse Radar Animation for Live Status */
    @keyframes pulse-ring {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.15); opacity: 0.4; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .status-pulse { animation: pulse-ring 2s infinite ease-in-out; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-hidden h-screen flex flex-col">

  <!-- NAVBAR / HEADER -->
  <header class="h-16 bg-slate-950/95 border-b border-slate-800/80 flex items-center justify-between px-4 z-30 shrink-0 backdrop-blur">
    <!-- Brand Info -->
    <div class="flex items-center space-x-3">
      <div class="p-2 bg-blue-600/20 border border-blue-500/30 rounded-xl text-blue-400">
        <i data-lucide="ship" class="w-6 h-6"></i>
      </div>
      <div>
        <div class="flex items-center gap-2">
          <h1 class="text-base font-bold tracking-wider text-white uppercase">Vessel Track</h1>
          <span class="text-[10px] font-semibold bg-blue-500/10 text-blue-400 border border-blue-500/20 px-2 py-0.5 rounded-full">v2.0 Live AIS</span>
        </div>
        <p class="text-xs text-slate-400 hidden sm:block">OpenWaters.io AIS WebSocket Monitoring</p>
      </div>
    </div>

    <!-- Search Input Bar -->
    <div class="flex items-center space-x-3 w-1/3 max-w-md mx-2">
      <div class="relative w-full">
        <input type="text" id="searchInput" onkeyup="filterVessels()" 
          placeholder="Cari Nama Kapal, IMO, atau MMSI..." 
          class="w-full bg-slate-900/90 text-xs text-slate-100 border border-slate-700/80 rounded-xl pl-9 pr-8 py-2 focus:outline-none focus:border-blue-500 transition placeholder-slate-500 shadow-inner">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-2.5"></i>
        <button id="clearSearchBtn" onclick="clearSearch()" class="hidden absolute right-2.5 top-2.5 text-slate-400 hover:text-white">
          <i data-lucide="x-circle" class="w-4 h-4"></i>
        </button>
      </div>
    </div>

    <!-- Action Buttons & Live WebSocket Status Indicator -->
    <div class="flex items-center space-x-3">
      <!-- Fit All Vessels Button -->
      <button onclick="fitAllMarkers()" class="hidden md:flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition" title="Pusatkan Seluruh Kapal">
        <i data-lucide="maximize-2" class="w-3.5 h-3.5"></i>
        <span>Fit Map</span>
      </button>

      <!-- Manual Refresh REST Data -->
      <button onclick="fetchDataFromBackend()" class="hidden sm:flex items-center space-x-1.5 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-lg transition" title="Refresh Data API">
        <i data-lucide="refresh-cw" class="w-3.5 h-3.5" id="refreshIcon"></i>
        <span>REST API</span>
      </button>

      <!-- WebSocket Live Connection Indicator -->
      <div id="wsStatusBadge" class="flex items-center space-x-2 bg-slate-900 border border-amber-500/30 text-amber-400 px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-300">
        <span id="wsStatusDot" class="w-2 h-2 rounded-full bg-amber-400 status-pulse"></span>
        <span id="wsStatusText" class="font-mono text-[11px]">Connecting AIS...</span>
      </div>
    </div>
  </header>

  <!-- MAIN LAYOUT -->
  <div class="flex flex-1 overflow-hidden relative">
    
    <!-- SIDEBAR FLEET LIST -->
    <aside id="sidebar" class="w-80 sm:w-96 bg-slate-950/95 border-r border-slate-800 flex flex-col z-20 shrink-0 backdrop-blur transition-all duration-300">
      
      <!-- Bounding Box Preset Selector -->
      <div class="p-3 border-b border-slate-800/80 bg-slate-900/50">
        <label class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider block mb-1.5 flex justify-between items-center">
          <span>Area Bounding Box (AIS Stream)</span>
          <span id="activeBboxTag" class="text-[10px] text-blue-400 font-mono">Indonesia</span>
        </label>
        <select id="bboxSelect" onchange="changeBboxArea(this.value)" class="w-full bg-slate-950 border border-slate-700/80 text-xs rounded-lg px-2.5 py-1.5 text-slate-200 focus:outline-none focus:border-blue-500 font-mono">
          <option value="indonesia">Indonesia & SE Asia [[-11, 94], [6, 141]]</option>
          <option value="malacca">Selat Malaka [[1, 98], [6, 105]]</option>
          <option value="south_china_sea">Laut Cina Selatan [[3, 105], [22, 120]]</option>
          <option value="java_sea">Selat Sunda & Laut Jawa [[-8, 105], [-4, 116]]</option>
          <option value="baltimore_nordic">OpenWaters Sample [[59, 10], [60, 11]]</option>
          <option value="global">Global Maritime [[-60, -180], [70, 180]]</option>
        </select>
      </div>

      <!-- Stats Bar Header -->
      <div class="px-4 py-2.5 border-b border-slate-800/80 bg-slate-900/20 flex items-center justify-between text-xs text-slate-400">
        <div class="flex items-center space-x-1.5">
          <i data-lucide="radio" class="w-3.5 h-3.5 text-emerald-400"></i>
          <span>Kapal Terpantau:</span>
          <strong id="vesselCount" class="text-white font-mono text-sm">0</strong>
        </div>
        <div class="flex items-center space-x-1 text-[11px] font-mono text-slate-500">
          <span>Events:</span>
          <span id="eventCount" class="text-blue-400">0</span>
        </div>
      </div>
      
      <!-- List Vessel Cards Container -->
      <div id="vesselList" class="flex-1 overflow-y-auto divide-y divide-slate-800/40 p-2 space-y-2">
        <div class="p-6 text-center text-slate-500 text-xs flex flex-col items-center justify-center space-y-2">
          <i data-lucide="loader" class="w-6 h-6 animate-spin text-blue-500"></i>
          <span>Menghubungkan ke stream AIS & memuat data...</span>
        </div>
      </div>

      <!-- Sidebar Footer Info -->
      <div class="p-3 border-t border-slate-800/80 bg-slate-900/60 text-[11px] text-slate-400 flex justify-between items-center">
        <span class="flex items-center gap-1"><i data-lucide="wifi" class="w-3 h-3 text-emerald-400"></i> Live WebSocket</span>
        <span id="lastMsgTime" class="font-mono text-[10px] text-slate-500">Waiting feed...</span>
      </div>
    </aside>

    <!-- LIVE MAP CONTAINER -->
    <main class="flex-1 relative bg-slate-900">
      <div id="map"></div>

      <!-- Floating Map Legend / Overlay Control -->
      <div class="absolute bottom-5 right-5 z-[1000] bg-slate-950/90 border border-slate-800 p-3 rounded-xl backdrop-blur shadow-2xl text-xs space-y-2 max-w-xs">
        <div class="font-semibold text-slate-200 border-b border-slate-800 pb-1 flex justify-between items-center">
          <span>Legenda AIS Peta</span>
          <i data-lucide="compass" class="w-3.5 h-3.5 text-blue-400"></i>
        </div>
        <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-300">
          <div class="flex items-center space-x-1.5">
            <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block"></span>
            <span>Bergerak (&gt;0.5 Kts)</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <span class="w-3 h-3 rounded-full bg-amber-500 inline-block"></span>
            <span>Berlabuh / Diam</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
            <span>API Backend</span>
          </div>
          <div class="flex items-center space-x-1.5">
            <span class="w-3 h-3 rounded-full bg-purple-500 inline-block"></span>
            <span>Live Stream</span>
          </div>
        </div>
      </div>
    </main>

  </div>

  <script>
    // URL Backend Google Apps Script (Ganti sesuai Deployment URL Anda jika ada)
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbz_kXaaa_9NZENaSQAnXlLxkmgthOr8nbThP0eCbbhuIPXS6GJdVvq_OZDV3GE-oqAy0w/exec";
    const WS_OPENWATERS_URL = "wss://ais.openwaters.io/v1/stream";

    // Presets Bounding Box Area [[SouthLat, WestLon], [NorthLat, EastLon]]
    const BBOX_PRESETS = {
      indonesia: [[-11, 94], [6, 141]],
      malacca: [[1, 98], [6, 105]],
      south_china_sea: [[3, 105], [22, 120]],
      java_sea: [[-8, 105], [-4, 116]],
      baltimore_nordic: [[59, 10], [60, 11]],
      global: [[-60, -180], [70, 180]]
    };

    let currentBboxKey = "indonesia";
    let map;
    let vesselMarkers = {};
    let vesselsStore = {}; // Map MMSI -> Object Data Kapal
    let ws;
    let wsReconnectTimer = null;
    let aisEventCounter = 0;
    let selectedMmsi = null;

    // Fallback Mock Data jika Backend URL Kosong / Gagal
    const MOCK_BACKEND_VESSELS = [
      {
        vessel_name: "KM SPIL CITRA",
        vessel_type: "Cargo / Container",
        imo_number: "9218314",
        mmsi_number: "525005123",
        telemetry: {
          latitude: -5.1120,
          longitude: 106.7820,
          speed_knots: 12.4,
          course_heading: 45,
          geofence_status: "Laut Jawa Zone 1",
          eta: "2026-10-04 14:00"
        }
      },
      {
        vessel_name: "TB SEAMAX 08",
        vessel_type: "Tug Boat",
        imo_number: "8765432",
        mmsi_number: "525112233",
        telemetry: {
          latitude: -1.2653,
          longitude: 116.8312,
          speed_knots: 6.8,
          course_heading: 180,
          geofence_status: "Teluk Balikpapan",
          eta: "2026-10-04 08:30"
        }
      },
      {
        vessel_name: "MT PERTAMINA SAMUDRA",
        vessel_type: "Oil Tanker",
        imo_number: "9823411",
        mmsi_number: "525990011",
        telemetry: {
          latitude: 1.2800,
          longitude: 103.8500,
          speed_knots: 0.2,
          course_heading: 270,
          geofence_status: "Singapore Strait Anchor",
          eta: "In Ballast"
        }
      }
    ];

    // Initialize Leaflet Map
    function initMap() {
      // Default Center di Indonesia (Makassar / Surabaya center)
      map = L.map('map', {
        zoomControl: false
      }).setView([-2.5, 118.0], 5);

      // Tambahkan zoom control di kanan atas
      L.control.zoom({ position: 'topright' }).addTo(map);

      // Dark Theme Map Tile Layer (CartoDB Dark Matter / Esri Canvas)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a> | AIS Stream: OpenWaters',
        subdomains: 'abcd',
        maxZoom: 18
      }).addTo(map);

      // Load Backend / Mock Data
      fetchDataFromBackend();

      // Start WebSocket Connection
      connectOpenWatersWebSocket();
    }

    // Inisialisasi & Handling Koneksi WebSocket Stream OpenWaters.io
    function connectOpenWatersWebSocket() {
      updateWsStatus("connecting", "Connecting AIS...");

      if (ws) {
        try { ws.close(); } catch(e){}
      }

      try {
        ws = new WebSocket(WS_OPENWATERS_URL);

        ws.onopen = () => {
          console.log("[WebSocket] Terhubung ke OpenWaters AIS Stream!");
          updateWsStatus("connected", "AIS Stream Live");
          
          // Clear reconnect timer jika ada
          if (wsReconnectTimer) clearTimeout(wsReconnectTimer);

          // Kirim payload subscribe sesuai bounding box yang dipilih
          subscribeBbox(currentBboxKey);
        };

        ws.onmessage = ({ data }) => {
          try {
            const ev = JSON.parse(data);
            
            // Filter pesan yang bertipe "event" saja
            if (ev.type !== "event") {
              if (ev.type === "welcome" || ev.type === "ack") {
                console.log("[WebSocket Info]", ev);
              }
              return;
            }

            aisEventCounter++;
            document.getElementById('eventCount').innerText = aisEventCounter.toLocaleString();
            document.getElementById('lastMsgTime').innerText = new Date().toLocaleTimeString();

            // Format dan perbarui data kapal
            processIncomingAisData(ev);

          } catch (err) {
            console.error("[WebSocket Parsing Error]", err, data);
          }
        };

        ws.onerror = (err) => {
          console.error("[WebSocket Error]", err);
          updateWsStatus("disconnected", "WS Connection Error");
        };

        ws.onclose = () => {
          console.warn("[WebSocket Disconnected] Mencoba koneksi ulang dalam 5 detik...");
          updateWsStatus("disconnected", "Reconnecting in 5s...");
          
          // Auto reconnect setelah 5 detik
          wsReconnectTimer = setTimeout(() => {
            connectOpenWatersWebSocket();
          }, 5000);
        };

      } catch (err) {
        console.error("[WebSocket Init Error]", err);
        updateWsStatus("disconnected", "Failed to Connect");
      }
    }

    // Kirim Perintah Subscribe ke OpenWaters WebSocket
    function subscribeBbox(key) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;

      const bboxCoords = BBOX_PRESETS[key] || BBOX_PRESETS['indonesia'];
      const payload = {
        type: "subscribe",
        bbox: bboxCoords
      };

      ws.send(JSON.stringify(payload));
      console.log(`[WebSocket Subscribed] Bounding Box '${key}':`, bboxCoords);
    }

    // Update Pilihan Bounding Box dari UI Dropdown
    function changeBboxArea(key) {
      currentBboxKey = key;
      document.getElementById('activeBboxTag').innerText = key.toUpperCase();
      
      // Zoom map ke bounding box baru
      const coords = BBOX_PRESETS[key];
      if (coords && map) {
        const bounds = L.latLngBounds(coords[0], coords[1]);
        map.fitBounds(bounds, { padding: [30, 30] });
      }

      // Re-subscribe WebSocket
      subscribeBbox(key);
    }

    // Updates WebSocket Status Badge UI
    function updateWsStatus(status, labelText) {
      const badge = document.getElementById('wsStatusBadge');
      const dot = document.getElementById('wsStatusDot');
      const text = document.getElementById('wsStatusText');

      text.innerText = labelText;

      if (status === "connected") {
        badge.className = "flex items-center space-x-2 bg-emerald-950/80 border border-emerald-500/40 text-emerald-400 px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-300";
        dot.className = "w-2 h-2 rounded-full bg-emerald-400 status-pulse";
      } else if (status === "connecting") {
        badge.className = "flex items-center space-x-2 bg-amber-950/80 border border-amber-500/40 text-amber-400 px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-300";
        dot.className = "w-2 h-2 rounded-full bg-amber-400 status-pulse";
      } else {
        badge.className = "flex items-center space-x-2 bg-rose-950/80 border border-rose-500/40 text-rose-400 px-3 py-1.5 rounded-full text-xs font-medium transition-all duration-300";
        dot.className = "w-2 h-2 rounded-full bg-rose-500";
      }
    }

    // Memproses data mentah AIS dari WebSocket
    function processIncomingAisData(ev) {
      if (!ev.mmsi || ev.lat === undefined || ev.lon === undefined) return;

      const mmsi = String(ev.mmsi);
      const existing = vesselsStore[mmsi] || {};

      // Parse Telemetri AIS
      const lat = parseFloat(ev.lat);
      const lon = parseFloat(ev.lon);
      const speed = ev.sog !== undefined ? parseFloat(ev.sog) : (existing.telemetry?.speed_knots || 0);
      const heading = ev.heading !== undefined && ev.heading !== 511 ? parseFloat(ev.heading) : (ev.cog !== undefined ? parseFloat(ev.cog) : 0);
      const shipName = ev.shipname || ev.name || existing.vessel_name || `MMSI ${mmsi}`;
      const vesselType = ev.ship_type_text || ev.ship_type || existing.vessel_type || "AIS Target";

      // Konstruksi / Update Objek Kapal
      const updatedVessel = {
        vessel_name: shipName,
        vessel_type: vesselType,
        imo_number: ev.imo || existing.imo_number || "N/A",
        mmsi_number: mmsi,
        callsign: ev.callsign || existing.callsign || "-",
        source: "websocket",
        last_updated: new Date().toLocaleTimeString(),
        telemetry: {
          latitude: lat,
          longitude: lon,
          speed_knots: speed,
          course_heading: heading,
          cog: ev.cog || 0,
          geofence_status: speed > 0.5 ? "Underway Live" : "Anchored / Moored",
          eta: ev.eta || existing.telemetry?.eta || "-"
        }
      };

      vesselsStore[mmsi] = updatedVessel;

      // Update Marker & List di Peta Real-time
      upsertVesselMarker(updatedVessel);
      renderVesselList();
    }

    // Fetch Initial Data dari REST API Backend (Google Apps Script)
    async function fetchDataFromBackend() {
      const refreshIcon = document.getElementById('refreshIcon');
      if (refreshIcon) refreshIcon.classList.add('animate-spin');

      let loadedData = [];

      try {
        if (GAS_WEB_APP_URL && !GAS_WEB_APP_URL.includes("YOUR_DEPLOYMENT_ID")) {
          const response = await fetch(`${GAS_WEB_APP_URL}?action=getVessels`);
          const result = await response.json();
          if (result.status === "success" && Array.isArray(result.data)) {
            loadedData = result.data;
          }
        }
      } catch (err) {
        console.warn("[Backend REST API] Tidak dapat mengambil dari GAS Web App, memakai Mock Data...", err);
      }

      // Gunakan mock data jika REST API gagal / kosong
      if (loadedData.length === 0) {
        loadedData = MOCK_BACKEND_VESSELS;
      }

      // Merge ke vesselsStore
      loadedData.forEach(v => {
        const mmsi = String(v.mmsi_number);
        vesselsStore[mmsi] = {
          ...v,
          source: v.source || "backend",
          last_updated: new Date().toLocaleTimeString()
        };
        upsertVesselMarker(vesselsStore[mmsi]);
      });

      renderVesselList();

      if (refreshIcon) {
        setTimeout(() => refreshIcon.classList.remove('animate-spin'), 600);
      }
    }

    // Membuat SVG Custom Marker Icon yang berputar sesuai heading kapal
    function createVesselSvgIcon(heading, speed, isSelected) {
      const colorClass = speed > 0.5 ? '#10b981' : '#f59e0b'; // Emerald if moving, Amber if stopped
      const strokeColor = isSelected ? '#3b82f6' : '#0f172a';
      const scaleFactor = isSelected ? 1.3 : 1.0;

      const svgHtml = `
        <div class="vessel-icon-wrapper" style="transform: rotate(${heading}deg) scale(${scaleFactor}); width: 32px; height: 32px;">
          <svg viewBox="0 0 24 24" width="28" height="28" fill="${colorClass}" stroke="${strokeColor}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 19 21 12 17 5 21 12 2"></polygon>
          </svg>
        </div>
      `;

      return L.divIcon({
        html: svgHtml,
        className: 'custom-vessel-marker',
        iconSize: [32, 32],
        iconAnchor: [16, 16],
        popupAnchor: [0, -14]
      });
    }

    // Render / Update Marker Kapal Spesifik di Peta
    function upsertVesselMarker(vessel) {
      const tel = vessel.telemetry;
      if (!tel || tel.latitude === undefined || tel.longitude === undefined) return;

      const mmsi = String(vessel.mmsi_number);
      const latLng = [tel.latitude, tel.longitude];
      const heading = tel.course_heading || 0;
      const speed = tel.speed_knots || 0;
      const isSelected = selectedMmsi === mmsi;

      const popupContent = `
        <div class="p-1 font-sans min-w-[210px]">
          <div class="flex items-center justify-between border-b border-slate-800 pb-1.5 mb-2">
            <h3 class="font-bold text-blue-400 text-sm leading-tight">${vessel.vessel_name}</h3>
            <span class="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-300 font-mono">${vessel.vessel_type || 'Ship'}</span>
          </div>
          <table class="text-xs text-slate-300 w-full space-y-1">
            <tr><td class="text-slate-500">MMSI:</td><td class="font-mono text-right text-slate-200">${vessel.mmsi_number}</td></tr>
            <tr><td class="text-slate-500">IMO / Call:</td><td class="font-mono text-right text-slate-200">${vessel.imo_number} / ${vessel.callsign || '-'}</td></tr>
            <tr><td class="text-slate-500">Kecepatan (SOG):</td><td class="font-mono text-right text-emerald-400 font-semibold">${speed.toFixed(1)} Knots</td></tr>
            <tr><td class="text-slate-500">Arah (COG):</td><td class="font-mono text-right text-slate-200">${heading.toFixed(0)}°</td></tr>
            <tr><td class="text-slate-500">Posisi:</td><td class="font-mono text-right text-slate-400 text-[11px]">${tel.latitude.toFixed(4)}, ${tel.longitude.toFixed(4)}</td></tr>
            <tr><td class="text-slate-500">Status/Geofence:</td><td class="text-right text-blue-300 font-medium">${tel.geofence_status || '-'}</td></tr>
            <tr><td class="text-slate-500">Update Terakhir:</td><td class="font-mono text-right text-slate-400 text-[10px]">${vessel.last_updated || '-'}</td></tr>
          </table>
        </div>
      `;

      if (vesselMarkers[mmsi]) {
        // Update marker posisi & icon rotasi
        vesselMarkers[mmsi].setLatLng(latLng);
        vesselMarkers[mmsi].setIcon(createVesselSvgIcon(heading, speed, isSelected));
        vesselMarkers[mmsi].getPopup().setContent(popupContent);
      } else {
        // Buat marker baru
        const marker = L.marker(latLng, {
          icon: createVesselSvgIcon(heading, speed, isSelected)
        }).addTo(map).bindPopup(popupContent);

        marker.on('click', () => {
          focusOnVessel(mmsi);
        });

        vesselMarkers[mmsi] = marker;
      }
    }

    // Render Daftar Kapal di Sidebar
    function renderVesselList() {
      const container = document.getElementById('vesselList');
      const searchVal = document.getElementById('searchInput').value.toLowerCase().trim();
      
      const allVessels = Object.values(vesselsStore);
      document.getElementById('vesselCount').innerText = allVessels.length;

      // Filter berdasarkan kata kunci cari
      const filtered = allVessels.filter(v => {
        const name = (v.vessel_name || '').toLowerCase();
        const imo = String(v.imo_number || '').toLowerCase();
        const mmsi = String(v.mmsi_number || '').toLowerCase();
        return name.includes(searchVal) || imo.includes(searchVal) || mmsi.includes(searchVal);
      });

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="p-6 text-center text-slate-500 text-xs">
            Tidak ada kapal yang sesuai dengan kriteria pencarian.
          </div>
        `;
        return;
      }

      // Urutkan berdasarkan waktu update paling baru
      filtered.sort((a, b) => (a.vessel_name || '').localeCompare(b.vessel_name || ''));

      container.innerHTML = '';
      filtered.forEach(vessel => {
        const tel = vessel.telemetry || {};
        const mmsi = String(vessel.mmsi_number);
        const isSelected = selectedMmsi === mmsi;
        const isLive = vessel.source === "websocket";

        const card = document.createElement('div');
        card.className = `p-3.5 rounded-xl cursor-pointer transition border ${
          isSelected 
            ? 'bg-blue-950/60 border-blue-500/80 shadow-lg' 
            : 'bg-slate-900/60 hover:bg-slate-800/80 border-slate-800/80 hover:border-slate-700'
        }`;
        
        card.onclick = () => focusOnVessel(mmsi);

        card.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center space-x-1.5 truncate pr-2">
              <span class="w-2 h-2 rounded-full ${tel.speed_knots > 0.5 ? 'bg-emerald-400' : 'bg-amber-400'}"></span>
              <span class="font-bold text-xs text-slate-100 truncate">${vessel.vessel_name}</span>
            </div>
            <span class="text-[9px] font-mono px-1.5 py-0.5 rounded ${isLive ? 'bg-purple-950 text-purple-300 border border-purple-800/50' : 'bg-slate-800 text-slate-400'}">
              ${isLive ? 'AIS LIVE' : 'REST'}
            </span>
          </div>
          
          <div class="text-[11px] text-slate-400 flex justify-between mt-1.5 font-mono">
            <span>MMSI: ${vessel.mmsi_number}</span>
            <span>HDG: ${tel.course_heading ? Math.round(tel.course_heading) + '°' : '-'}</span>
          </div>

          <div class="flex items-center justify-between text-xs mt-2 pt-2 border-t border-slate-800/60">
            <span class="text-emerald-400 font-mono font-semibold">${tel.speed_knots ? tel.speed_knots.toFixed(1) : 0} Kts</span>
            <span class="text-slate-400 text-[10px] font-mono truncate max-w-[150px] text-right">${tel.geofence_status || '-'}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Focus Map & Zoom ke Kapal Terpilih
    function focusOnVessel(mmsi) {
      selectedMmsi = String(mmsi);
      
      const vessel = vesselsStore[selectedMmsi];
      if (vessel && vesselMarkers[selectedMmsi]) {
        const marker = vesselMarkers[selectedMmsi];
        const latLng = marker.getLatLng();

        // Update rotasi & visual pilihan marker
        upsertVesselMarker(vessel);

        map.setView(latLng, 12, { animate: true, duration: 0.8 });
        marker.openPopup();
      }

      renderVesselList();
    }

    // Fit Bounds Seluruh Marker Kapal
    function fitAllMarkers() {
      const markersArray = Object.values(vesselMarkers);
      if (markersArray.length === 0) return;

      const group = L.featureGroup(markersArray);
      map.fitBounds(group.getBounds().pad(0.15));
    }

    // Filter Kapal berdasarkan input teks
    function filterVessels() {
      const input = document.getElementById('searchInput');
      const clearBtn = document.getElementById('clearSearchBtn');
      if (input.value.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      renderVesselList();
    }

    // Clear input pencarian
    function clearSearch() {
      document.getElementById('searchInput').value = '';
      document.getElementById('clearSearchBtn').classList.add('hidden');
      renderVesselList();
    }

    // Window Onload Handler
    window.onload = () => {
      initMap();
      lucide.createIcons();
    };
  </script>
</body>
</html>
